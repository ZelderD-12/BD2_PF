<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamKon Clinic | Historial de Recetas</title>
    <link rel="stylesheet" href="../../FamKon_Clinic.css">
    <link rel="stylesheet" href="recetas.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="header"></div>
    <div id="nav"></div>

    <div class="receta-page">
        <div class="receta-container">

            <div class="receta-header">
                <a href="../../FamKon_Clinic.html" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Volver al inicio
                </a>
                <h1><i class="fas fa-history"></i> Historial de Recetas</h1>
                <p id="subtituloHistorial">Todas las recetas del paciente</p>
            </div>

            <!-- Filtros -->
            <div class="card">
                <div class="filtros-row">
                    <div class="form-group">
                        <label><i class="fas fa-calendar-alt"></i> Desde</label>
                        <input type="date" id="filtroDesde">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar-alt"></i> Hasta</label>
                        <input type="date" id="filtroHasta">
                    </div>
                    <div style="display:flex; align-items:flex-end; gap:10px;">
                        <button class="btn-primary" id="btnFiltrar">
                            <i class="fas fa-search"></i> Filtrar
                        </button>
                        <button class="btn-outline" id="btnLimpiarFiltro">
                            <i class="fas fa-times"></i> Limpiar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla de historial -->
            <div class="card">
                <div class="card-title"><i class="fas fa-list-alt"></i> Recetas emitidas</div>
                <div id="tablaHistorial">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i> Cargando historial...
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="footer"></div>

    <script src="../../Javascript/Api_services.js"></script>
    <script src="historial.js"></script>
</body>
</html>
