<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamKon Clinic | Panel Recepcion</title>
    <link rel="stylesheet" href="../../FamKon_Clinic.css">
    <link rel="stylesheet" href="recepcion.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="header"></div>
    <div id="nav"></div>

    <div class="recepcion-page">
        <div class="recepcion-container">

            <div class="recepcion-titulo">
                <h1><i class="fas fa-concierge-bell"></i> Panel de Recepcion</h1>
                <p>Gestion de tickets y cola de atencion</p>
                <a href="pantalla_publica.html" class="btn-pantalla" target="_blank">
                    <i class="fas fa-tv"></i> Abrir Pantalla Publica
                </a>
            </div>

            <div class="panel-grid">

                <!-- Columna izquierda -->
                <div class="panel-left">

                    <!-- Generar Ticket -->
                    <div class="panel-card">
                        <div class="card-header">
                            <i class="fas fa-ticket-alt"></i>
                            <h2>Generar Ticket</h2>
                        </div>
                        <div class="card-body">
                            <form id="formTicket">

                                <div class="form-group">
                                    <label><i class="fas fa-building"></i> Sede</label>
                                    <select id="idSede" required>
                                        <option value="">Selecciona una sede</option>
                                        <option value="1">Sede Zona 19</option>
                                        <option value="2">Sede Zona 10</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label><i class="fas fa-stethoscope"></i> Servicio</label>
                                    <select id="idServicio" required>
                                        <option value="">Selecciona un servicio</option>
                                        <option value="1">Consulta General</option>
                                        <option value="2">Odontologia</option>
                                        <option value="3">Cardiologia</option>
                                        <option value="4">Neurologia</option>
                                        <option value="5">Pediatria</option>
                                        <option value="6">Laboratorio Clinico</option>
                                        <option value="7">Radiologia</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label><i class="fas fa-user"></i> ID Paciente</label>
                                    <input type="number" id="idPaciente" placeholder="Ej: 1234" min="1" required>
                                </div>

                                <div class="form-group">
                                    <label><i class="fas fa-sort-amount-up"></i> Prioridad</label>
                                    <select id="prioridad" required>
                                        <option value="NORMAL">Normal</option>
                                        <option value="ANCIANO">Adulto Mayor</option>
                                        <option value="EMBARAZO">Embarazo</option>
                                        <option value="DISCAPACIDAD">Discapacidad</option>
                                        <option value="ESPECIAL">ESPECIAL (requiere supervisor)</option>
                                    </select>
                                </div>

                                <div id="seccionEspecial" class="seccion-especial" style="display:none;">
                                    <div class="alerta-especial">
                                        <i class="fas fa-exclamation-triangle"></i>
                                        Requiere autorizacion de supervisor
                                    </div>
                                    <div class="form-group">
                                        <label><i class="fas fa-user-shield"></i> ID Supervisor</label>
                                        <input type="number" id="idSupervisor" placeholder="ID del supervisor" min="1">
                                    </div>
                                    <div class="form-group">
                                        <label><i class="fas fa-comment-alt"></i> Motivo</label>
                                        <textarea id="motivoEspecial" rows="2" placeholder="Motivo de la autorizacion especial..."></textarea>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label><i class="fas fa-calendar-check"></i> Desde cita confirmada (opcional)</label>
                                    <input type="number" id="idCita" placeholder="ID de cita — dejar vacio si es walk-in" min="1">
                                </div>

                                <div id="mensajeTicket" class="mensaje"></div>

                                <button type="submit" class="btn btn-primary btn-full" id="btnGenerar">
                                    <i class="fas fa-plus-circle"></i> Generar Ticket
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Llamar Siguiente -->
                    <div class="panel-card">
                        <div class="card-header verde">
                            <i class="fas fa-bullhorn"></i>
                            <h2>Llamar Siguiente</h2>
                        </div>
                        <div class="card-body llamar-body">
                            <p class="llamar-desc">Llama al siguiente paciente en cola segun prioridad</p>
                            <button id="btnLlamar" class="btn-llamar">
                                <i class="fas fa-bullhorn"></i> Llamar Siguiente
                            </button>
                            <div id="mensajeLlamar" class="mensaje"></div>
                        </div>
                    </div>

                </div>

                <!-- Columna derecha -->
                <div class="panel-right">

                    <!-- Ticket Actual -->
                    <div class="panel-card">
                        <div class="card-header naranja">
                            <i class="fas fa-user-clock"></i>
                            <h2>Ticket Actual</h2>
                        </div>
                        <div class="card-body">
                            <div id="ticketActual" class="ticket-actual-vacio">
                                <i class="fas fa-inbox"></i>
                                <p>Sin ticket en atencion</p>
                            </div>
                            <div id="accionesTicket" class="acciones-ticket" style="display:none;">
                                <button id="btnEnAtencion" class="btn-accion btn-en-atencion">
                                    <i class="fas fa-user-check"></i> En Atencion
                                </button>
                                <button id="btnFinalizar" class="btn-accion btn-finalizar">
                                    <i class="fas fa-check-circle"></i> Finalizar
                                </button>
                                <button id="btnNoShow" class="btn-accion btn-no-show">
                                    <i class="fas fa-user-slash"></i> No Show
                                </button>
                            </div>
                            <div id="mensajeAccion" class="mensaje"></div>
                        </div>
                    </div>

                    <!-- Cola de Espera -->
                    <div class="panel-card">
                        <div class="card-header">
                            <i class="fas fa-list-ol"></i>
                            <h2>Cola de Espera</h2>
                            <span id="contadorCola" class="badge-contador">0</span>
                        </div>
                        <div class="card-body">
                            <div id="listaCola">
                                <div class="loading-spinner">
                                    <i class="fas fa-spinner fa-spin"></i> Cargando cola...
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="recepcion.js"></script>
</body>
</html>
